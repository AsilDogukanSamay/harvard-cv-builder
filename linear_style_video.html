<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvard CV Builder — Linear / Motion Canvas 3D Sinematik Lansman</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #050608; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; perspective: 1200px; }

        /* Background Ambient Glows */
        .glow-bg {
            position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(147, 51, 234, 0.08) 50%, transparent 70%); filter: blur(60px); pointer-events: none; border-radius: 50%;
        }

        /* 3D Stage Container */
        .stage-3d {
            width: 85vw; max-width: 1100px; height: 48vw; max-height: 620px; position: relative; transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; justify-content: center;
        }

        /* 3D Glassmorphic Desktop Window */
        .app-window-3d {
            width: 100%; height: 100%; background: rgba(18, 20, 29, 0.85); backdrop-filter: blur(20px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 40px 100px rgba(0,0,0,0.9), 0 0 40px rgba(56, 189, 248, 0.2); position: relative; overflow: hidden; display: flex; flex-direction: column; transform: rotateX(8deg) rotateY(-4deg) translateZ(0);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* macOS Window Header */
        .win-bar { height: 42px; background: rgba(28, 32, 48, 0.9); border-bottom: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
        .win-dots { display: flex; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .dot-r { background: #ff5f56; } .dot-y { background: #ffbd2e; } .dot-g { background: #27c93f; }
        .win-title { font-size: 13px; font-weight: 600; color: #94a3b8; letter-spacing: 0.5px; }

        /* Interactive Showcase Body */
        .win-body { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        /* Kinetic Overlay Text */
        .kinetic-title {
            position: absolute; top: 40px; font-size: 36px; font-weight: 900; letter-spacing: -1px; text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10;
        }

        .kinetic-sub {
            position: absolute; bottom: 40px; font-size: 16px; font-weight: 600; color: #cbd5e1; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 24px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 10;
        }

        /* Floating UI Badges */
        .ui-badge {
            position: absolute; background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(56, 189, 248, 0.4); padding: 14px 20px; border-radius: 14px; font-size: 14px; font-weight: 700; color: #38bdf8; box-shadow: 0 15px 35px rgba(0,0,0,0.5); animation: float 3s ease-in-out infinite alternate;
        }
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 100% { transform: translateY(-12px) rotate(2deg); } }

        /* Controls */
        .bottom-nav { position: fixed; bottom: 25px; display: flex; gap: 12px; z-index: 100; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-btn { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .nav-btn.active, .nav-btn:hover { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .back-link { position: fixed; top: 20px; left: 20px; background: rgba(15, 23, 42, 0.85); color: #fff; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid #334155; z-index: 100; }
    </style>
</head>
<body>

    <div class="glow-bg"></div>
    <a href="editor.html" class="back-link"><i class="fas fa-arrow-left"></i> Editöre Dön</a>

    <!-- 3D Stage -->
    <div class="stage-3d" id="stage">
        <div class="app-window-3d" id="app-window">
            <div class="win-bar">
                <div class="win-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
                <div class="win-title">harvard-cv-builder.app — Linear 3D Motion Showcase</div>
                <div style="font-size: 11px; color: #38bdf8; font-weight: 700;">60 FPS</div>
            </div>
            
            <div class="win-body">
                <div class="kinetic-title" id="kt-title">🔥 Harvard CV Builder 2026</div>
                
                <!-- Floating Glass UI Cards -->
                <div class="ui-badge" style="top: 100px; left: 60px;"><i class="fas fa-bullseye"></i> 🎯 ATS Skoru: %96 (Workday Uyumlu)</div>
                <div class="ui-badge" style="bottom: 120px; right: 70px; border-color: #c084fc; color: #c084fc;"><i class="fas fa-robot"></i> 🤖 Canlı AI Etken Fiil Asistanı</div>
                <div class="ui-badge" style="top: 140px; right: 90px; border-color: #22c55e; color: #22c55e;"><i class="fas fa-file-pdf"></i> 📄 Tek Tıkla PDF CV Yükleme</div>

                <div class="kinetic-sub" id="kt-sub">Harvard Extension School Standartlarında 1 Sayfa Vektörel Özgeçmiş Motoru</div>
            </div>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="setPerspective(0)">Sahne 1: Giriş</button>
        <button class="nav-btn" onclick="setPerspective(1)">Sahne 2: 3D Eğim</button>
        <button class="nav-btn" onclick="setPerspective(2)">Sahne 3: Makro Odak</button>
        <button class="nav-btn" onclick="setPerspective(3)">Sahne 4: Grand Finale</button>
    </div>

    <script>
        const perspectives = [
            { rx: 8, ry: -4, tz: 0, title: "🔥 Harvard CV Builder 2026", sub: "Harvard Extension School Standartlarında 1 Sayfa Vektörel Özgeçmiş Motoru" },
            { rx: 15, ry: 12, tz: 40, title: "🎯 %96+ ATS Skor Motoru", sub: "Taleo, Workday & Greenhouse Robot Algoritmaları İle Tam Uyum" },
            { rx: -5, ry: -15, tz: 80, title: "🤖 Canlı Akıllı AI CV Asistanı", sub: "Deneyim Maddelerini Rakamlar Ve Harvard Etken Fiilleri İle Güçlendirin" },
            { rx: 0, ry: 0, tz: 0, title: "🖨️ Tek Tıkla Jilet Gibi PDF Çıktısı", sub: "Sıfır Üyelik • %100 Tarayıcı İçi Gizlilik • Açık Kaynak GitHub" }
        ];

        let autoIndex = 0;

        function setPerspective(idx) {
            autoIndex = idx;
            const p = perspectives[idx];
            const win = document.getElementById('app-window');
            win.style.transform = `rotateX(${p.rx}deg) rotateY(${p.ry}deg) translateZ(${p.tz}px)`;
            document.getElementById('kt-title').textContent = p.title;
            document.getElementById('kt-sub').textContent = p.sub;

            document.querySelectorAll('.nav-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === idx);
            });
        }

        // Auto loop every 4 seconds
        setInterval(() => {
            autoIndex = (autoIndex + 1) % perspectives.length;
            setPerspective(autoIndex);
        }, 4000);
    </script>
</body>
</html>
